<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PYAAR — The Cards of the Pantheon</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0d0805;
      color: #f6ead6;
      font-family: "Cormorant Garamond", "Garamond", "Georgia", serif;
      min-height: 100vh;
    }
    body { padding: 40px 24px 80px; }

    .sheet {
      max-width: 1280px;
      margin: 0 auto;
      background:
        radial-gradient(circle at 30% 0%, rgba(212, 166, 78, 0.10), transparent 55%),
        radial-gradient(circle at 70% 100%, rgba(200, 52, 92, 0.10), transparent 55%),
        #1a0f08;
      padding: 50px 40px 56px;
      border: 1px solid rgba(212, 166, 78, 0.25);
      border-radius: 6px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7);
    }
    .sheet-head {
      text-align: center;
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(212, 166, 78, 0.25);
    }
    .sheet-head h1 {
      font-family: "Cinzel", serif;
      font-size: 36pt;
      letter-spacing: 0.32em;
      color: #e8b860;
      margin: 0 0 8px;
      text-shadow: 0 0 24px rgba(212, 166, 78, 0.45);
    }
    .sheet-head .sub {
      font-style: italic;
      letter-spacing: 0.12em;
      color: #c9b896;
      font-size: 14pt;
    }
    .ornament-row {
      text-align: center;
      color: #b08828;
      font-size: 18px;
      letter-spacing: 1.4em;
      margin: 12px 0 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 540px)  { .grid { grid-template-columns: 1fr; } }

    /* ===== CARD ===== */
    .card {
      aspect-ratio: 5 / 7;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.55),
        0 0 0 2px rgba(212, 166, 78, 0.25);
      page-break-inside: avoid;
    }
    .card svg.card-art {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    body.focus .sheet { padding: 80px 0; box-shadow: none; background: transparent; border: none; }
    body.focus .sheet-head, body.focus .grid > .card:not(.focused) { display: none; }
    body.focus .grid {
      grid-template-columns: 1fr;
      max-width: 520px;
      margin: 0 auto;
    }
    body.focus .grid > .card.focused {
      aspect-ratio: 5 / 7;
      width: 100%;
    }

    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body { background: white; padding: 0; }
      .sheet { box-shadow: none; padding: 0; max-width: none; background: white; border: none; }
      .sheet-head { display: none; }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 4mm; }
    }
  </style>
</head>
<body>

<div class="sheet">
  <header class="sheet-head">
    <h1>PYAAR · The Pantheon</h1>
    <p class="sub">Eight cards · eight gods · eight movements</p>
    <div class="ornament-row">❀ · ❀ · ❀</div>
  </header>

  <div class="grid">

    <!-- ===================================================================
         I · APHRODITE · The Lover · 1 cell toward the Heart
         =================================================================== -->
    <article class="card crown" data-type="LOVER">
      <svg viewBox="0 0 500 700" class="card-art" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg-lover" cx="50%" cy="42%" r="55%">
            <stop offset="0%"  stop-color="#ffd6e0"/>
            <stop offset="55%" stop-color="#e85a82"/>
            <stop offset="100%" stop-color="#6b1228"/>
          </radialGradient>
          <radialGradient id="halo-lover" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="rgba(255, 240, 180, 0.9)"/>
            <stop offset="60%" stop-color="rgba(255, 200, 130, 0.3)"/>
            <stop offset="100%" stop-color="rgba(255, 200, 130, 0)"/>

        <!-- Background -->
        <rect width="500" height="700" fill="url(#bg-lover)"/>
        <rect width="500" height="700" fill="url(#stars-lover)" opacity="0.7"/>

        <!-- Decorative outer frame -->
        <rect x="12" y="12" width="476" height="676" fill="none" stroke="#ffd070" stroke-width="2" rx="10"/>
        <rect x="22" y="22" width="456" height="656" fill="none" stroke="#ffd070" stroke-width="0.8" opacity="0.7" rx="6"/>
        <!-- Corner scalloped flourishes -->
        <g stroke="#ffd070" stroke-width="1.2" fill="none" opacity="0.85">
          <path d="M 22 60 Q 30 60 30 50 Q 30 30 50 30 Q 60 30 60 22"/>
          <path d="M 478 60 Q 470 60 470 50 Q 470 30 450 30 Q 440 30 440 22"/>

          <path d="M 478 640 Q 470 640 470 650 Q 470 670 450 670 Q 440 670 440 678"/>

        <!-- Top-left index -->
        <g transform="translate(58, 86)">

          <text x="0" y="52" font-family="serif" font-size="46" fill="#ffd070" text-anchor="middle">♥</text>
        </g>
        <!-- Bottom-right index (rotated) -->
        <g transform="translate(442, 614) rotate(180)">
          <text x="0" y="0" font-family="Cinzel, serif" font-weight="700" font-size="70" fill="#ffd070" text-anchor="middle">1</text>
          <text x="0" y="52" font-family="serif" font-size="46" fill="#ffd070" text-anchor="middle">♥</text>
        </g>

        <!-- Halo behind figure -->
        <circle cx="250" cy="300" r="170" fill="url(#halo-lover)"/>
        <!-- Sun-ray pattern -->
        <g transform="translate(250, 300)" stroke="rgba(255, 220, 130, 0.45)" stroke-width="1.2">
          <g><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(30)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(60)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(90)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(120)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(150)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(180)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(210)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(240)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(270)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(300)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
          <g transform="rotate(330)"><line x1="0" y1="-180" x2="0" y2="-150"/></g>
        </g>

        <!-- Roses floating around -->
        <g fill="#ffe0e8" stroke="#a62244" stroke-width="0.8" opacity="0.85">
          <g transform="translate(90, 220) scale(0.9)">
            <circle r="6" fill="#e85a82"/>
            <path d="M -5 -2 Q -2 -7 0 -3 Q 2 -7 5 -2 Q 7 1 4 4 Q 0 6 -4 4 Q -7 1 -5 -2 Z" fill="#ffc0d0"/>
          </g>
          <g transform="translate(415, 250) scale(0.7)">
            <circle r="6" fill="#e85a82"/>
            <path d="M -5 -2 Q -2 -7 0 -3 Q 2 -7 5 -2 Q 7 1 4 4 Q 0 6 -4 4 Q -7 1 -5 -2 Z" fill="#ffc0d0"/>
          </g>
          <g transform="translate(110, 420) scale(0.8)">
            <circle r="6" fill="#e85a82"/>
            <path d="M -5 -2 Q -2 -7 0 -3 Q 2 -7 5 -2 Q 7 1 4 4 Q 0 6 -4 4 Q -7 1 -5 -2 Z" fill="#ffc0d0"/>
          </g>
          <g transform="translate(400, 450) scale(0.6)">
            <circle r="6" fill="#e85a82"/>
            <path d="M -5 -2 Q -2 -7 0 -3 Q 2 -7 5 -2 Q 7 1 4 4 Q 0 6 -4 4 Q -7 1 -5 -2 Z" fill="#ffc0d0"/>
          </g>
        </g>

        <!-- APHRODITE — figure -->
        <g transform="translate(250, 300)">
          <!-- Sea-shell pedestal -->
          <path d="M -80 180 Q 0 100 80 180 L 80 200 L -80 200 Z" fill="#fff0c8" stroke="#a06030" stroke-width="2"/>
          <g stroke="#a06030" stroke-width="1.2" fill="none">
            <path d="M -60 195 Q -60 165 -55 145"/>
            <path d="M -30 195 Q -30 160 -25 130"/>
            <path d="M 0 195 Q 0 155 0 125"/>
            <path d="M 30 195 Q 30 160 25 130"/>
            <path d="M 60 195 Q 60 165 55 145"/>
          </g>
          <!-- Body / dress -->
          <path d="M -50 100 Q -50 60 0 50 Q 50 60 50 100 L 60 180 L -60 180 Z" fill="#ffd6e0" stroke="#6b1228" stroke-width="2"/>
          <!-- Gold sash -->
          <path d="M -52 110 L 52 110 L 50 120 L -50 120 Z" fill="#ffd070" stroke="#a06030" stroke-width="1.2"/>
          <!-- Dress folds -->
          <g stroke="#e85a82" stroke-width="1" fill="none" opacity="0.7">
            <path d="M -40 130 L -36 178"/>
            <path d="M 0 122 L 0 180"/>
            <path d="M 40 130 L 36 178"/>
          </g>
          <!-- Necklace -->
          <ellipse cx="0" cy="58" rx="22" ry="6" fill="none" stroke="#ffd070" stroke-width="2"/>
          <circle cx="0" cy="64" r="3" fill="#a62244" stroke="#ffd070" stroke-width="1"/>
          <!-- Neck -->
          <rect x="-8" y="40" width="16" height="20" fill="#f5d8b8" stroke="#6b1228" stroke-width="0.8"/>
          <!-- Head -->
          <circle cx="0" cy="10" r="36" fill="#f5d8b8" stroke="#6b1228" stroke-width="1.5"/>
          <!-- Hair -->
          <path d="M -36 0 Q -42 -36 0 -42 Q 42 -36 36 0 L 36 14 Q 18 8 0 8 Q -18 8 -36 14 Z" fill="#3a1808"/>
          <!-- Hair flowing down -->
          <path d="M -36 14 Q -40 40 -38 70 L -36 60 L -32 38 Z" fill="#3a1808"/>
          <path d="M 36 14 Q 40 40 38 70 L 36 60 L 32 38 Z" fill="#3a1808"/>
          <!-- Crown of roses -->
          <g>
            <circle cx="-22" cy="-22" r="6" fill="#e85a82" stroke="#6b1228" stroke-width="0.8"/>
            <circle cx="-22" cy="-22" r="2.5" fill="#ffe0e8"/>
            <circle cx="0" cy="-34" r="7" fill="#e85a82" stroke="#6b1228" stroke-width="0.8"/>
            <circle cx="0" cy="-34" r="3" fill="#ffe0e8"/>
            <circle cx="22" cy="-22" r="6" fill="#e85a82" stroke="#6b1228" stroke-width="0.8"/>
            <circle cx="22" cy="-22" r="2.5" fill="#ffe0e8"/>
            <!-- Leaves -->
            <ellipse cx="-12" cy="-30" rx="3" ry="1.5" fill="#5a7030" transform="rotate(-30, -12, -30)"/>
            <ellipse cx="12" cy="-30" rx="3" ry="1.5" fill="#5a7030" transform="rotate(30, 12, -30)"/>
          </g>
          <!-- Bindi -->
          <circle cx="0" cy="-2" r="2.5" fill="#a62244"/>
          <!-- Eyes (almond, classical) -->
          <path d="M -16 8 Q -12 4 -8 8 Q -12 10 -16 8 Z" fill="#3a1808"/>
          <path d="M 8 8 Q 12 4 16 8 Q 12 10 8 8 Z" fill="#3a1808"/>
          <circle cx="-12" cy="7" r="1.2" fill="#000"/>
          <circle cx="12" cy="7" r="1.2" fill="#000"/>
          <!-- Soft lips -->
          <path d="M -8 24 Q 0 30 8 24 Q 0 27 -8 24" fill="#a62244" stroke="#6b1228" stroke-width="0.5"/>
          <!-- Dove on shoulder -->
          <g transform="translate(-66, 80)">
            <ellipse cx="0" cy="0" rx="14" ry="9" fill="#fff8f0" stroke="#a06030" stroke-width="1.2"/>
            <ellipse cx="-3" cy="-3" rx="10" ry="5" fill="#fff8f0" stroke="#a06030" stroke-width="0.8" transform="rotate(-20, -3, -3)"/>
            <circle cx="8" cy="-4" r="5" fill="#fff8f0" stroke="#a06030" stroke-width="1"/>
            <path d="M 10 -5 L 16 -4 L 12 -2 Z" fill="#ffa030"/>
            <circle cx="10" cy="-4" r="1" fill="#000"/>
          </g>
          <!-- Mirror in hand -->
          <g transform="translate(70, 100)">
            <ellipse cx="0" cy="0" rx="10" ry="14" fill="#ffd070" stroke="#6b1228" stroke-width="1.5"/>
            <ellipse cx="0" cy="0" rx="6" ry="10" fill="#fff8f0" opacity="0.8"/>
            <line x1="0" y1="14" x2="0" y2="30" stroke="#a06030" stroke-width="2.5"/>
            <circle cx="0" cy="-18" r="2.5" fill="#a62244"/>
          </g>
        </g>

        <!-- Nameplate scroll -->
        <g transform="translate(250, 615)">
          <rect x="-130" y="-30" width="260" height="60" fill="rgba(255, 240, 200, 0.85)" stroke="#a06030" stroke-width="1" rx="4"/>
          <text x="0" y="-8" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="18" fill="#1c1410" letter-spacing="3">THE LOVER</text>
          <text x="0" y="13" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="18" fill="#a62244">Aphrodite</text>
          <text x="0" y="27" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3a2a">Ἀφροδίτη · goddess of love</text>
        </g>
      </svg>
    </article>

    <!-- ===================================================================
         II · ARES · The Warrior · 1 cell in 8 directions
         =================================================================== -->
    <article class="card" data-type="WARRIOR">
      <svg viewBox="0 0 500 700" class="card-art" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg-war" cx="50%" cy="50%" r="60%">
            <stop offset="0%"  stop-color="#e8b860"/>
            <stop offset="35%" stop-color="#c83020"/>
            <stop offset="100%" stop-color="#3a0810"/>
          </radialGradient>
          <radialGradient id="halo-war" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="rgba(255, 220, 120, 0.85)"/>
            <stop offset="60%" stop-color="rgba(255, 160, 60, 0.3)"/>
            <stop offset="100%" stop-color="rgba(255, 160, 60, 0)"/>
          </radialGradient>
        </defs>
        <rect width="500" height="700" fill="url(#bg-war)"/>

        <!-- Crossed weapons decorative pattern -->
        <g stroke="rgba(255, 220, 130, 0.18)" stroke-width="1.5" fill="none">
          <line x1="60"  y1="100" x2="120" y2="160"/>
          <line x1="60"  y1="160" x2="120" y2="100"/>
          <line x1="380" y1="100" x2="440" y2="160"/>
          <line x1="380" y1="160" x2="440" y2="100"/>
          <line x1="60"  y1="520" x2="120" y2="580"/>
          <line x1="60"  y1="580" x2="120" y2="520"/>
          <line x1="380" y1="520" x2="440" y2="580"/>
          <line x1="380" y1="580" x2="440" y2="520"/>
        </g>

        <rect x="12" y="12" width="476" height="676" fill="none" stroke="#ffd070" stroke-width="2" rx="10"/>
        <rect x="22" y="22" width="456" height="656" fill="none" stroke="#ffd070" stroke-width="0.8" opacity="0.7" rx="6"/>
        <g stroke="#ffd070" stroke-width="1.2" fill="none" opacity="0.85">
          <path d="M 22 60 Q 30 60 30 50 Q 30 30 50 30 Q 60 30 60 22"/>
          <path d="M 478 60 Q 470 60 470 50 Q 470 30 450 30 Q 440 30 440 22"/>
          <path d="M 22 640 Q 30 640 30 650 Q 30 670 50 670 Q 60 670 60 678"/>
          <path d="M 478 640 Q 470 640 470 650 Q 470 670 450 670 Q 440 670 440 678"/>
        </g>

        <g transform="translate(58, 86)">
          <text x="0" y="0" font-family="Cinzel, serif" font-weight="700" font-size="70" fill="#ffd070" text-anchor="middle">1</text>
          <text x="0" y="52" font-family="serif" font-size="46" fill="#ffd070" text-anchor="middle">⚔</text>
        </g>
        <g transform="translate(442, 614) rotate(180)">
          <text x="0" y="0" font-family="Cinzel, serif" font-weight="700" font-size="70" fill="#ffd070" text-anchor="middle">1</text>
          <text x="0" y="52" font-family="serif" font-size="46" fill="#ffd070" text-anchor="middle">⚔</text>
        </g>

        <circle cx="250" cy="290" r="160" fill="url(#halo-war)"/>

          <!-- Body / cuirass -->

          <!-- Bronze greaves -->
          <rect x="-44" y="200" width="22" height="32" fill="#b08828" stroke="#3a1010" stroke-width="1"/>
          <rect x="22" y="200" width="22" height="32" fill="#b08828" stroke="#3a1010" stroke-width="1"/>
          <!-- Head + helmet -->
          <g transform="translate(0, -20)">
            <!-- Face under helmet -->
            <circle cx="0" cy="0" r="32" fill="#f5d8b8" stroke="#3a1010" stroke-width="1.5"/>

            <!-- Nose guard -->

            <!-- Beard -->
            <path d="M -16 8 Q 0 22 16 8 L 16 12 Q 0 28 -16 12 Z" fill="#3a1010"/>
            <!-- Crested plume -->
            <path d="M -10 -50 Q -14 -76 0 -84 Q 14 -76 10 -50" fill="#a62244" stroke="#3a1010" stroke-width="1.2"/>

            <!-- Plume horsehair texture -->
            <g stroke="#6b1228" stroke-width="0.6" fill="none">

              <path d="M 4 -82 L 3 -54"/>
              <path d="M 8 -78 L 6 -54"/>
            </g>
          </g>
          <!-- Spear -->
          <line x1="90" y1="-60" x2="78" y2="220" stroke="#6a4810" stroke-width="4"/>
          <path d="M 86 -60 L 90 -76 L 94 -60 L 90 -50 Z" fill="#c8d4e0" stroke="#3a1010" stroke-width="1.2"/>
          <circle cx="84" cy="110" r="6" fill="#f5d8b8" stroke="#3a1010" stroke-width="1"/>
          <!-- Lightning motif behind spear -->
          <path d="M 100 -30 L 110 -10 L 105 -10 L 115 10" stroke="rgba(255, 220, 130, 0.5)" stroke-width="2" fill="none"/>
        </g>

        <!-- Nameplate -->
        <g transform="translate(250, 615)">
          <rect x="-130" y="-30" width="260" height="60" fill="rgba(255, 240, 200, 0.9)" stroke="#a06030" stroke-width="1" rx="4"/>
          <text x="0" y="-8" text-anchor="middle" font-family="Cinzel, serif" font-weight="600" font-size="18" fill="#1c1410" letter-spacing="3">THE WARRIOR</text>
          <text x="0" y="13" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="18" fill="#a62244">Ares</text>
          <text x="0" y="27" text-anchor="middle" font-family="serif" font-size="10" fill="#4a3a2a">Ἄρης · god of war</text>
        </g>
      </svg>
    </article>

    <!-- ===================================================================
         III · ATHENA · The Sage · ∞ diagonal
         =================================================================== -->
    <article class="card" data-type="SAGE">
      <svg viewBox="0 0 500 700" class="card-art" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg-sage" cx="50%" cy="40%" r="65%">
            <stop offset="0%"  stop-color="#6a90c0"/>
            <stop offset="50%" stop-color="#1f3a6a"/>
            <stop offset="100%" stop-color="#0a1024"/>

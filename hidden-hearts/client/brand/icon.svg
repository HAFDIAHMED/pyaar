<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="PYAAR — the love card game">
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1f7a4d"/><stop offset="55%" stop-color="#14572f"/><stop offset="100%" stop-color="#0a3320"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e23950"/><stop offset="100%" stop-color="#c01e36"/></linearGradient>
    <filter id="cardsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <rect x="0" y="0" width="1080" height="1080" rx="236" fill="url(#felt)"/>
  <rect x="34" y="34" width="1012" height="1012" rx="208" fill="none" stroke="#6b4a22" stroke-width="6" opacity="0.5"/>

  <!-- card behind (fanned) -->
  <g transform="rotate(9 540 560)"><rect x="378" y="246" width="384" height="556" rx="34" fill="#ece7da" stroke="#cdc7b6" stroke-width="3"/></g>

  <!-- front card -->
  <g transform="rotate(-5 540 560)" filter="url(#cardsh)">
    <rect x="332" y="232" width="416" height="600" rx="38" fill="#ffffff" stroke="#d7d2c5" stroke-width="3"/>
    <!-- top-left index -->
    <text x="372" y="318" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" fill="url(#red)">A</text>
    <path transform="translate(372,330) scale(2.0)" fill="url(#red)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12 16-21.2C32 3.8 28.2 0 23.6 0z"/>
    <!-- big centre heart -->
    <path transform="translate(394,420) scale(9.0)" fill="url(#red)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12 16-21.2C32 3.8 28.2 0 23.6 0z"/>
    <!-- bottom-right index (rotated) -->
    <g transform="rotate(180 708 746)">
      <text x="672" y="772" font-family="Georgia,'Times New Roman',serif" font-size="74" font-weight="700" fill="url(#red)">A</text>
      <path transform="translate(672,784) scale(2.0)" fill="url(#red)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12 16-21.2C32 3.8 28.2 0 23.6 0z"/>
    </g>
  </g>
</svg>
